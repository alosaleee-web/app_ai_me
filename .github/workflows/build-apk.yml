name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract AI Studio project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully"
          echo "Android files:"
          find extracted/android -maxdepth 3 -type f | head -100

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          ANDROID_DIR="extracted/android"

          if [ ! -d "$ANDROID_DIR" ]; then
            echo "ERROR: Android directory not found"
            exit 1
          fi

          cd "$ANDROID_DIR"

          echo "Building Android project..."

          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
