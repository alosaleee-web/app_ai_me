name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract AI Studio project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "✅ تم العثور على: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "📦 تم فك الضغط بنجاح"
          find extracted -maxdepth 5 -type f -name gradlew -print

      - name: Build APK
        shell: bash
        run: |
          set -e

          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "❌ لم يتم العثور على gradlew"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          ANDROID_DIR="$(dirname "$GRADLEW")"

          echo "✅ Android project: $ANDROID_DIR"

          cd "$ANDROID_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
