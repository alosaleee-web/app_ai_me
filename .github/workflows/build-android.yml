name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/*.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully."

          echo "Searching for Android project..."
          find extracted -maxdepth 5 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -d "extracted/android" ]; then
            ANDROID_DIR="extracted/android"
          else
            ANDROID_DIR="$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"
          fi

          if [ -z "$ANDROID_DIR" ] || [ ! -d "$ANDROID_DIR" ]; then
            echo "ERROR: Android project directory not found."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project found at: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Create missing launcher icons
        shell: bash
        run: |
          set -e

          RES_DIR="$ANDROID_DIR/app/src/main/res"
          export RES_DIR

          echo "Creating missing launcher icons..."

          mkdir -p "$RES_DIR/mipmap-mdpi"
          mkdir -p "$RES_DIR/mipmap-hdpi"
          mkdir -p "$RES_DIR/mipmap-xhdpi"
          mkdir -p "$RES_DIR/mipmap-xxhdpi"
          mkdir -p "$RES_DIR/mipmap-xxxhdpi"

          python3 <<'PY'
          import struct
          import zlib
          import os

          res_dir = os.environ["RES_DIR"]

          def create_png(path, width=192, height=192):
              raw = bytearray()

              for y in range(height):
                  raw.append(0)
                  for x in range(width):
                      raw.extend((30, 90, 200, 255))

              def chunk(name, data):
                  return (
                      struct.pack(">I", len(data))
                      + name
                      + data
                      + struct.pack(
                          ">I",
                          zlib.crc32(name + data) & 0xffffffff
                      )
                  )

              png_data = b'\x89PNG\r\n\x1a\n'

              png_data += chunk(
                  b'IHDR',
                  struct.pack(
                      ">IIBBBBB",
                      width, height, 8, 6, 0, 0, 0
                  )
              )

              png_data += chunk(
                  b'IDAT',
                  zlib.compress(bytes(raw), 9)
              )

              png_data += chunk(b'IEND', b'')

              with open(path, "wb") as file:
                  file.write(png_data)

          folders = [
              "mipmap-mdpi",
              "mipmap-hdpi",
              "mipmap-xhdpi",
              "mipmap-xxhdpi",
              "mipmap-xxxhdpi"
          ]

          for folder in folders:
              create_png(
                  os.path.join(
                      res_dir,
                      folder,
                      "ic_launcher.png"
                  )
              )

              create_png(
                  os.path.join(
                      res_dir,
                      folder,
                      "ic_launcher_round.png"
                  )
              )

          print("Launcher icons created successfully.")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Starting Android APK build..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK
        shell: bash
        run: |
          echo "Searching for generated APK..."
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "extracted/**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
