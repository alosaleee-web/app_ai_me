name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/*.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully."

          echo "Searching for Android project..."
          find extracted -maxdepth 5 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -d "extracted/android" ]; then
            ANDROID_DIR="extracted/android"
          else
            ANDROID_DIR="$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"
          fi

          if [ -z "$ANDROID_DIR" ] || [ ! -d "$ANDROID_DIR" ]; then
            echo "ERROR: Android project directory not found."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project found at: $ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Starting Android APK build..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK
        shell: bash
        run: |
          echo "Searching for generated APK..."
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "extracted/**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
